# XcodeGen spec. Run ./generate.sh to create PomodoroTimer.xcodeproj (it is not committed).
name: PomodoroTimer
options:
  bundleIdPrefix: com.doberman68
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ${TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  PomodoroTimer:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Pomodoro
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/PomodoroTimer.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.doberman68.pomodorotimer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doberman68.pomodorotimer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: TimerWidget
  TimerWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Pomodoro
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/TimerWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.doberman68.pomodorotimer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doberman68.pomodorotimer.widget
